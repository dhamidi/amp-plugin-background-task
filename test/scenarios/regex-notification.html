<!doctype html>
<meta charset="utf-8" />

<scenario id="regex-notification" expected="pass">
	<summary>A contains notification can match output with a regular expression pattern.</summary>

	<defaults wait-for-idle-ms="100" history-lines="40"></defaults>

	<run>
		<bt-start id="worker" name="regex-notifier">
			<script type="application/javascript">
				process.stdin.setEncoding('utf8')
				let buffered = ''
				console.log('regex-notifier-ready')

				process.stdin.on('data', (chunk) => {
					buffered += chunk
					const lines = buffered.split('\n')
					buffered = lines.pop() ?? ''
					for (const line of lines)
						console.log(`build-step-${line.replace(/\r$/, '')}:ok`)
				})

				setInterval(() => {}, 1_000_000)
			</script>
			<notifications enabled="false"></notifications>
		</bt-start>

		<bt-wait id="ready" task="worker" timeout-ms="2000">
			<contains>regex-notifier-ready</contains>
		</bt-wait>

		<bt-configure-notifications id="configure" task="worker">
			<notifications
				enabled="true"
				steer="false"
				cooldown-ms="0"
				debounce-ms="0"
				max-messages="1"
			>
				<trigger
					type="contains"
					pattern="build-step-\d+:ok"
					regex="true"
					include-snapshot="true"
				></trigger>
			</notifications>
		</bt-configure-notifications>

		<bt-send id="send-step" task="worker">
			42
			<key>Enter</key>
		</bt-send>

		<bt-wait id="matched-output" task="worker" timeout-ms="2000">
			<contains>build-step-42:ok</contains>
		</bt-wait>

		<bt-wait id="settled" task="worker" idle-ms="200" timeout-ms="2000"></bt-wait>
	</run>

	<then>
		<expect-step step="configure" action="configure_notifications" status="running">
			<field name="notifications.triggers.0.pattern">
				<equals>build-step-\d+:ok</equals>
			</field>
			<field name="notifications.triggers.0.regex">
				<equals>true</equals>
			</field>
		</expect-step>

		<expect-step step="matched-output" action="wait" matched="true">
			<field name="snapshot.screen">
				<contains>build-step-42:ok</contains>
			</field>
		</expect-step>

		<expect-notification count="1">
			<contains>matched "build-step-\\d+:ok"</contains>
			<contains>build-step-42:ok</contains>
		</expect-notification>
	</then>

	<cleanup>
		<bt-stop task="worker" mode="kill"></bt-stop>
	</cleanup>
</scenario>
