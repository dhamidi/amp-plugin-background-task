<!doctype html>
<meta charset="utf-8" />

<scenario id="not-contains-notification" expected="pass">
	<summary>
		A notContains notification fires when recent output lacks the configured marker.
	</summary>

	<defaults wait-for-idle-ms="100" history-lines="40"></defaults>

	<run>
		<bt-start id="worker" name="not-contains-notifier">
			<script type="application/javascript">
				process.stdin.setEncoding('utf8')
				let buffered = ''
				console.log('not-contains-ready')

				process.stdin.on('data', (chunk) => {
					buffered += chunk
					const lines = buffered.split('\n')
					buffered = lines.pop() ?? ''
					for (const line of lines) console.log(`status:${line.replace(/\r$/, '')}`)
				})

				setInterval(() => {}, 1_000_000)
			</script>
			<notifications enabled="false"></notifications>
		</bt-start>

		<bt-wait id="ready" task="worker" timeout-ms="2000">
			<contains>not-contains-ready</contains>
		</bt-wait>

		<bt-configure-notifications id="configure" task="worker">
			<notifications
				enabled="true"
				steer="false"
				cooldown-ms="0"
				debounce-ms="0"
				max-messages="1"
			>
				<trigger
					type="notContains"
					pattern="forbidden-marker"
					include-snapshot="true"
				></trigger>
			</notifications>
		</bt-configure-notifications>

		<bt-send id="send-safe-status" task="worker">
			safe
			<key>Enter</key>
		</bt-send>

		<bt-wait id="saw-safe-status" task="worker" timeout-ms="2000">
			<contains>status:safe</contains>
		</bt-wait>

		<bt-wait id="settled" task="worker" idle-ms="200" timeout-ms="2000"></bt-wait>
	</run>

	<then>
		<expect-step step="configure" action="configure_notifications" status="running">
			<field name="notifications.triggers.0.type">
				<equals>notContains</equals>
			</field>
			<field name="notifications.triggers.0.pattern">
				<equals>forbidden-marker</equals>
			</field>
		</expect-step>

		<expect-step step="saw-safe-status" action="wait" matched="true">
			<field name="snapshot.screen">
				<contains>status:safe</contains>
				<not-contains>forbidden-marker</not-contains>
			</field>
		</expect-step>

		<expect-notification count="1">
			<contains>no longer contains "forbidden-marker"</contains>
			<contains>status:safe</contains>
		</expect-notification>
	</then>

	<cleanup>
		<bt-stop task="worker" mode="kill"></bt-stop>
	</cleanup>
</scenario>
